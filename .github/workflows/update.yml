# Update, test, publish, as in t3code-nix's update.yml. Run by the watcher
# (workflow_dispatch), by health.yml every hour, or by hand. One real run at
# a time; a dispatch arriving during a run waits, and GitHub keeps only the
# newest waiting run, which is enough because every run reads upstream and
# main afresh. A run with nothing new but held releases retries them
# (scripts/update.ts). Every update run tests every package.
#
# Jobs that run vendor programs (the test, narrow and final jobs, whose
# checks run them in the Nix sandbox) have no secrets and read-only
# permissions; only jobs that run none get write permissions.
# Values from upstream reach scripts through files and environment
# variables, never through ${{ }} in shell code. Artifacts and outputs live
# in $RUNNER_TEMP, outside the checkout. The candidate and the observations
# are read back by ID; test results by name pattern, as in t3code-nix (a
# forged one can only make a test run lie: an accepted risk), each checked
# against the tree it says it tested.
name: update
run-name: ${{ inputs.dry_run && 'update (dry run)' || (inputs.attempt != '0' && inputs.attempt != '' && format('update (retry {0})', inputs.attempt)) || 'update' }}

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: Re-dispatch count after main moved during publishing
        default: "0"
      dry_run:
        description: Record every write instead of doing it (runs this ref's scripts)
        type: boolean
        default: false

permissions:
  contents: read

# One run runs and one waits, and a newer dispatch replaces the waiting one.
# Dry runs, and real runs dispatched on a branch by mistake (the gate stops
# them), share a group per ref, so they can't replace a run waiting on main.
concurrency:
  group: ${{ (inputs.dry_run || github.ref != 'refs/heads/main') && format('update-dry-{0}', github.ref) || 'update' }}
  cancel-in-progress: false

env:
  DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
  ATTEMPT: ${{ inputs.attempt }}
  RUN_ID: ${{ github.run_id }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Is this run's workflow definition still current? If so, resolve upstream
  # into a candidate. Runs no vendor code. A real run only once the
  # repository variable UPDATES is `true`; a dry run always.
  resolve:
    if: inputs.dry_run || vars.UPDATES == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      actions: write
    outputs:
      current: ${{ steps.gate.outputs.current }}
      head: ${{ steps.gate.outputs.head }}
      inputs: ${{ steps.candidate.outputs.inputs }}
      candidate-artifact: ${{ steps.candidate-artifact.outputs.artifact-id }}
      obs-artifact: ${{ steps.obs-artifact.outputs.artifact-id }}
      seen-at: ${{ steps.resolve.outputs.seen-at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          nix: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          head=$(git rev-parse HEAD)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::a real run publishes main; dispatch it on main, or as a dry run"
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci/gate.ts "$WORKFLOW_SHA" "$head" >> "$GITHUB_OUTPUT"
      - name: Releases held by open issues
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/held.ts "$RUNNER_TEMP/held.json"
      # The verifier's gpg, and Nix for the nixpkgs bump's evaluation.
      - if: steps.gate.outputs.current == 'true'
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Resolve upstream releases
        id: resolve
        if: steps.gate.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HELD_JSON: ${{ runner.temp }}/held.json
          NIX_CONFIG: access-tokens = github.com=${{ github.token }}
        run: |
          echo "seen-at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/obs"
          gpg=$(nix build --inputs-from . nixpkgs#gnupg --no-link --print-out-paths)
          GPG="$gpg/bin/gpg" node scripts/update.ts --write --out "$RUNNER_TEMP/obs/observations-resolve.json"
          jq -r '.observations[] | select(.kind == "waiting" or .kind == "incomplete-release" or .kind == "unavailable") | "\(.repo): \(.detail)"' \
            "$RUNNER_TEMP/obs/observations-resolve.json" >> "$GITHUB_STEP_SUMMARY"
      - id: candidate
        if: steps.gate.outputs.current == 'true'
        env:
          HELD_JSON: ${{ runner.temp }}/held.json
        run: |
          inputs=$(node scripts/ci/candidate.ts make "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/obs/observations-candidate.json")
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          jq -r '.inputs[] | if .files == [] then "\(.name): catching the NixOS-stable snapshot up" else "\(.name): \(.from) -> \(.to)" end' \
            "$RUNNER_TEMP/candidate/inputs.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: candidate-artifact
        if: steps.candidate.outputs.inputs != ''
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: candidate
          path: ${{ runner.temp }}/candidate
          retention-days: 7
      # The status page shows "testing" from the candidate; best effort.
      - name: Tell the status page
        if: steps.candidate-artifact.outputs.artifact-id != '' && env.DRY_RUN != 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "::warning::couldn't start pages.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: obs-artifact
        if: always()
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: observations-resolve
          path: ${{ runner.temp }}/obs
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: dry-run-gate
          path: ${{ runner.temp }}/dry-run-gate.json
          if-no-files-found: ignore
          retention-days: 7

  # New-tracker detection (scripts/studio-hosts.ts), beside the tests, off
  # resolve's critical path: diagnostic, never holds a release; its result
  # reaches the issues job (by ID) even when extraction fails. Runs no
  # vendor code (it only reads the binary's bytes).
  studio-hosts:
    needs: resolve
    if: needs.resolve.outputs.current == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # A diagnostic: its failure is its own finding, never update-failed.
    continue-on-error: true
    outputs:
      obs-artifact: ${{ steps.obs-artifact.outputs.artifact-id }}
    steps:
      # The finding for a diagnostic that doesn't get to the end, written
      # first: a later step that fails (checkout, setup, the download)
      # still leaves it; a successful extraction replaces it.
      - name: The fallback findings
        run: |
          mkdir -p "$RUNNER_TEMP/obs"
          for scope in default stable; do
            jq -n --arg s "$scope" '{observations: [{kind: "studio-hosts", repo: "(extraction)", channel: $s, version: null,
              detail: "Studio'"'"'s hosts diagnostic didn'"'"'t get to the end (a setup step failed or it ran out of time)"}]}' \
              > "$RUNNER_TEMP/obs/observations-studio-hosts-$scope.json"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.resolve.outputs.candidate-artifact != ''
        with:
          artifact-ids: ${{ needs.resolve.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: ./.github/actions/setup
      # The candidate's Studio pin, when it moves one: that's the release to
      # look at.
      - name: The candidate's pins
        run: '[ ! -d "$RUNNER_TEMP/candidate" ] || node scripts/ci/candidate.ts apply "$RUNNER_TEMP/candidate"'
      - name: Studio's third-party hosts
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/obs"
          for scope in default stable; do
            attr=.#artcraft-studio.src pins=versions
            [ "$scope" = stable ] && attr=.#legacyPackages.x86_64-linux.stable.artcraft-studio.src pins=versions/stable
            version=$(jq -r .version "$pins/artcraft.json")
            out="$RUNNER_TEMP/obs/observations-studio-hosts-$scope.json"
            # A download or extraction that fails, or runs out of time, is a
            # finding of its own (scripts/studio-hosts.ts).
            # 2 x (150 + 45) s, well inside the step's limit, so each scope's
            # fallback is always written.
            # Into a file of its own, renamed over the fallback only once
            # complete: the fallback stands until then.
            if ! { tarball=$(timeout 150 nix build --no-link --print-out-paths "$attr") \
                && timeout 45 node scripts/studio-hosts.ts "$tarball" "$scope" "$version" > "$out.new" \
                && jq -e '.observations | type == "array"' "$out.new" > /dev/null; }; then
              jq -n --arg s "$scope" --arg v "$version" '{observations: [{kind: "studio-hosts", repo: "(extraction)", channel: $s, version: $v,
                detail: "Studio'"'"'s hosts couldn'"'"'t be extracted (the download or the extraction failed or ran out of time)"}]}' > "$out.new"
            fi
            mv "$out.new" "$out"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: obs-artifact
        if: always()
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: observations-studio-hosts
          path: ${{ runner.temp }}/obs
          if-no-files-found: ignore
          retention-days: 7

  # The full suite on the whole candidate, per architecture, in parts, and
  # NixOS stable's two groups. No secrets, no write permissions.
  test:
    needs: resolve
    if: needs.resolve.outputs.inputs != ''
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        leg: [apps1, apps2, apps3, studio, flake, default-build, stable, next]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - name: The runner, and a sampler for the job's length
        run: scripts/ci/sample.sh "$RUNNER_TEMP/results/sampler-candidate-${{ matrix.system }}-${{ matrix.leg }}.txt"
      - name: The nixpkgs pin this job tests
        run: |
          lock="$RUNNER_TEMP/candidate/files/flake.lock"
          [ ! -e "$lock" ] || cp "$lock" flake.lock
      - uses: ./.github/actions/setup
      - name: Test the candidate
        if: matrix.leg != 'stable' && matrix.leg != 'next'
        timeout-minutes: 80
        run: |
          node scripts/ci/candidate.ts apply "$RUNNER_TEMP/candidate"
          node scripts/ci/test.ts candidate ${{ matrix.system }} "$RUNNER_TEMP/results" --part=${{ matrix.leg }}
      - name: NixOS stable
        if: ${{ !cancelled() && (matrix.leg == 'stable' || matrix.leg == 'next') }}
        timeout-minutes: 80
        run: |
          tree=$(node scripts/ci/candidate.ts tree "$RUNNER_TEMP/candidate")
          node scripts/ci/stable.ts candidate ${{ matrix.system }} "$RUNNER_TEMP/results" --tree="$tree" --group=${{ matrix.leg }}
      # Also when the step failed (a part's missing file leaves its suite
      # incomplete); the smokes' logs and screenshots come along.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: results-candidate-${{ matrix.system }}-${{ matrix.leg }}
          path: ${{ runner.temp }}/results
          retention-days: 7

  narrow-plan:
    needs: [resolve, test]
    if: always() && needs.resolve.outputs.inputs != '' && needs.test.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      failed: ${{ steps.plan.outputs.failed }}
      legs: ${{ steps.plan.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-candidate-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: ./.github/actions/setup
        with:
          nix: false
      - run: node scripts/ci/merge-parts.ts "$RUNNER_TEMP/results"
      - id: plan
        run: node scripts/ci/narrow.ts plan "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/results" >> "$GITHUB_OUTPUT"

  # Main alone, in the full suite's parts like the candidate, and each input
  # alone (just main with a single input). An input alone runs its
  # repository's checks and the flake-wide ones, plus any whose derivation
  # differs from main's (test.ts), and inherits main's verdicts for the rest
  # (narrow.ts). Main and nixpkgs-stable alone also get a NixOS stable leg,
  # which decides nixpkgs-stable.
  narrow:
    needs: [resolve, narrow-plan]
    if: always() && needs.narrow-plan.outputs.failed == 'true'
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.narrow-plan.outputs.legs) }}
        system: [x86_64-linux, aarch64-linux]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - name: The nixpkgs pin this job tests
        env:
          SET: ${{ matrix.leg.set }}
        run: |
          lock="$RUNNER_TEMP/candidate/files/flake.lock"
          if [ "$SET" = nixpkgs ] && [ -e "$lock" ]; then cp "$lock" flake.lock; fi
      - uses: ./.github/actions/setup
      - name: Test ${{ matrix.leg.set }} alone
        if: ${{ !matrix.leg.stable }}
        timeout-minutes: 80
        env:
          SET: ${{ matrix.leg.set }}
          PART: ${{ matrix.leg.part }}
        run: |
          if [ "$SET" != main ]; then node scripts/ci/candidate.ts apply "$RUNNER_TEMP/candidate" "$SET"; fi
          node scripts/ci/test.ts "$SET" ${{ matrix.system }} "$RUNNER_TEMP/results" ${PART:+"--part=$PART"}
      # NixOS stable's group, for main and nixpkgs-stable alone: that input
      # is gated on it (narrow.ts).
      - name: NixOS stable, ${{ matrix.leg.set }} alone
        if: ${{ matrix.leg.stable }}
        timeout-minutes: 80
        env:
          SET: ${{ matrix.leg.set }}
        run: |
          if [ "$SET" = main ]; then tree=$(git rev-parse 'HEAD^{tree}')
          else tree=$(node scripts/ci/candidate.ts tree "$RUNNER_TEMP/candidate" "$SET"); fi
          node scripts/ci/stable.ts "$SET" ${{ matrix.system }} "$RUNNER_TEMP/results" --tree="$tree" --group=stable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: results-narrow-${{ matrix.leg.set }}-${{ matrix.system }}${{ matrix.leg.part && format('-{0}', matrix.leg.part) || '' }}
          path: ${{ runner.temp }}/results
          retention-days: 7

  decide:
    needs: [resolve, narrow-plan, narrow]
    if: always() && needs.narrow-plan.outputs.failed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      final: ${{ steps.decide.outputs.final }}
      obs-artifact: ${{ steps.obs-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - uses: ./.github/actions/setup
        with:
          nix: false
      - run: node scripts/ci/merge-parts.ts "$RUNNER_TEMP/results"
      - id: decide
        run: |
          mkdir -p "$RUNNER_TEMP/obs"
          out="$RUNNER_TEMP/obs/observations-decide.json"
          node scripts/ci/narrow.ts decide "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/results" > "$out"
          echo "final=$(jq -r '.final | join(",")' "$out")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: obs-artifact
        if: always()
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: observations-decide
          path: ${{ runner.temp }}/obs
          if-no-files-found: ignore
          retention-days: 7

  # The final tree, main plus the inputs that passed alone, gets the full
  # suite again, in the same parts and stable groups.
  final:
    needs: [resolve, decide]
    if: always() && needs.decide.outputs.final != ''
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        leg: [apps1, apps2, apps3, studio, flake, default-build, stable, next]
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - name: The nixpkgs pin this job tests
        env:
          NAMES: ${{ needs.decide.outputs.final }}
        run: |
          lock="$RUNNER_TEMP/candidate/files/flake.lock"
          case ",$NAMES," in
            *,nixpkgs,*) [ ! -e "$lock" ] || cp "$lock" flake.lock ;;
          esac
      - uses: ./.github/actions/setup
      - name: Test the final candidate
        if: matrix.leg != 'stable' && matrix.leg != 'next'
        timeout-minutes: 80
        env:
          FINAL: ${{ needs.decide.outputs.final }}
        run: |
          node scripts/ci/candidate.ts apply "$RUNNER_TEMP/candidate" "$FINAL"
          node scripts/ci/test.ts final ${{ matrix.system }} "$RUNNER_TEMP/results" --part=${{ matrix.leg }}
      - name: NixOS stable
        if: ${{ !cancelled() && (matrix.leg == 'stable' || matrix.leg == 'next') }}
        timeout-minutes: 80
        env:
          FINAL: ${{ needs.decide.outputs.final }}
        run: |
          tree=$(node scripts/ci/candidate.ts tree "$RUNNER_TEMP/candidate" "$FINAL")
          node scripts/ci/stable.ts final ${{ matrix.system }} "$RUNNER_TEMP/results" --tree="$tree" --group=${{ matrix.leg }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: results-final-${{ matrix.system }}-${{ matrix.leg }}
          path: ${{ runner.temp }}/results
          retention-days: 7

  # Decide whether the set may be published (it passed on both systems),
  # then publish it, with its release name. No vendor code runs here.
  publish:
    needs: [resolve, narrow-plan, decide, final]
    if: >-
      always() && needs.narrow-plan.result == 'success'
      && (needs.narrow-plan.outputs.failed != 'true' || needs.decide.outputs.final != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
      actions: write
    outputs:
      ok: ${{ steps.verdict.outputs.ok }}
      obs-artifact: ${{ steps.obs-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor: ignore[artipacked] publish pushes with these credentials;
          # it uploads nothing from the checkout, only files under $RUNNER_TEMP.
          ref: ${{ needs.resolve.outputs.head }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.candidate-artifact }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-${{ needs.narrow-plan.outputs.failed == 'true' && 'final' || 'candidate' }}-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      # A narrowed final's NixOS stable is judged beside main's (narrow.ts):
      # narrowing's main legs.
      - if: needs.narrow-plan.outputs.failed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-narrow-main-*
          path: ${{ runner.temp }}/results
          merge-multiple: true
      - uses: ./.github/actions/setup
        with:
          nix: false
      - run: node scripts/ci/merge-parts.ts "$RUNNER_TEMP/results"
      - id: verdict
        env:
          SET: ${{ needs.narrow-plan.outputs.failed == 'true' && 'final' || 'candidate' }}
          FINAL: ${{ needs.decide.outputs.final }}
        run: |
          C="$RUNNER_TEMP/candidate"
          mkdir -p "$RUNNER_TEMP/obs"
          names=$FINAL
          [ "$SET" = candidate ] && names=$(node scripts/ci/candidate.ts names "$C")
          out="$RUNNER_TEMP/obs/observations-verdict.json"
          node scripts/ci/narrow.ts verdict "$C" "$RUNNER_TEMP/results" "$SET" "$names" > "$out"
          tree=$(jq -r '.tree // ""' "$out")
          # Only stable results of the tree being published count. A reader
          # that fails fails the step (update-failed), never an empty move.
          move=$(node scripts/ci/stable.ts "$SET" "$RUNNER_TEMP/results" --move-json --tree="$tree")
          jq -e 'type == "object" and (.move | type == "boolean")' <<< "$move" > /dev/null
          {
            echo "ok=$(jq -r .ok "$out")"
            echo "tree=$tree"
            echo "names=$names"
            echo "move=$move"
          } >> "$GITHUB_OUTPUT"
      - id: publish
        if: steps.verdict.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAMES: ${{ steps.verdict.outputs.names }}
          TREE: ${{ steps.verdict.outputs.tree }}
          MOVE: ${{ steps.verdict.outputs.move }}
        run: |
          out="$RUNNER_TEMP/obs/observations-publish.json"
          node scripts/ci/publish.ts "$RUNNER_TEMP/candidate" "$NAMES" "$TREE" "$MOVE" > "$out"
          cat "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: obs-artifact
        if: always()
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: observations-publish
          path: ${{ runner.temp }}/obs
          if-no-files-found: ignore
          retention-days: 7

  # Tags and GitHub Releases from main's history and trailers, in order; the
  # Latest marker. One at a time (its own concurrency group).
  reconcile:
    needs: [resolve, publish]
    if: always() && needs.resolve.outputs.current == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ${{ inputs.dry_run && format('reconcile-dry-{0}', github.ref) || 'reconcile' }}
      cancel-in-progress: false
    permissions:
      contents: write
      # Re-enabling the scheduled workflows, and reading runs' states.
      actions: write
    outputs:
      obs-artifact: ${{ steps.obs-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          nix: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          mkdir -p "$RUNNER_TEMP/obs"
          node scripts/ci/reconcile.ts origin/main > "$RUNNER_TEMP/obs/observations-reconcile.json"
          cat "$RUNNER_TEMP/obs/observations-reconcile.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: obs-artifact
        if: always()
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: observations-reconcile
          path: ${{ runner.temp }}/obs
          if-no-files-found: ignore
          retention-days: 7

  # The writer of issues; shares its concurrency group with health.yml's and
  # tooling.yml's issue steps.
  issues:
    needs: [resolve, studio-hosts, test, narrow-plan, narrow, decide, final, publish, reconcile]
    if: always() && needs.resolve.result != 'skipped' && (inputs.dry_run || github.ref == 'refs/heads/main') && (needs.resolve.result != 'success' || needs.resolve.outputs.current == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ${{ inputs.dry_run && format('issues-dry-{0}', github.ref) || 'issues' }}
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head || github.sha }}
          persist-credentials: false
      # By ID, from the outputs of the jobs that made them.
      - name: The observation artifacts to read
        id: obs
        env:
          IDS: >-
            ${{ needs.resolve.outputs.obs-artifact }},${{ needs.studio-hosts.outputs.obs-artifact }},${{ needs.decide.outputs.obs-artifact }},
            ${{ needs.publish.outputs.obs-artifact }},${{ needs.reconcile.outputs.obs-artifact }}
        run: |
          ids=
          for id in ${IDS//,/ }; do
            if [[ $id =~ ^[0-9]+$ ]]; then ids+=${ids:+,}$id; fi
          done
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.obs.outputs.ids != ''
        with:
          artifact-ids: ${{ steps.obs.outputs.ids }}
          path: ${{ runner.temp }}/obs
          merge-multiple: true
      - uses: ./.github/actions/setup
        with:
          nix: false
      - name: Make sure the label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/obs" "$RUNNER_TEMP/dry-run"
          if [ "$DRY_RUN" = true ]; then
            echo '[{"action": "create_label", "name": "artcraft-nix"}]' > "$RUNNER_TEMP/dry-run/label.json"
            exit 0
          fi
          gh label create artcraft-nix --color 5319e7 \
            --description "Opened and closed by artcraft-nix's update workflow" 2>/dev/null || true
      - name: Apply observations
        env:
          GH_TOKEN: ${{ github.token }}
          # Every job but the Studio diagnostic, whose failure is its own
          # finding (studio-hosts).
          FAILED: >-
            ${{ contains(needs.resolve.result, 'failure') || contains(needs.test.result, 'failure') || contains(needs.narrow-plan.result, 'failure')
            || contains(needs.narrow.result, 'failure') || contains(needs.decide.result, 'failure') || contains(needs.final.result, 'failure')
            || contains(needs.publish.result, 'failure') || contains(needs.reconcile.result, 'failure')
            || contains(needs.resolve.result, 'cancelled') || contains(needs.test.result, 'cancelled') || contains(needs.narrow-plan.result, 'cancelled')
            || contains(needs.narrow.result, 'cancelled') || contains(needs.decide.result, 'cancelled') || contains(needs.final.result, 'cancelled')
            || contains(needs.publish.result, 'cancelled') || contains(needs.reconcile.result, 'cancelled') }}
          SEEN_AT: ${{ needs.resolve.outputs.seen-at }}
          STUDIO_EXPECTED: ${{ needs.resolve.outputs.current }}
          STUDIO_OBS: ${{ needs.studio-hosts.outputs.obs-artifact }}
          STUDIO_RESULT: ${{ needs.studio-hosts.result }}
        run: |
          # The Studio diagnostic ran but left no observations (killed before
          # its upload): its own finding, per scope. Skipped (resolve failed
          # after its gate) is no finding: update-failed covers the run.
          if [ "$STUDIO_EXPECTED" = true ] && [ "$STUDIO_RESULT" != skipped ] && [ -z "$STUDIO_OBS" ]; then
            for scope in default stable; do
              jq -n --arg s "$scope" '{observations: [{kind: "studio-hosts", repo: "(extraction)", channel: $s, version: null,
                detail: "Studio'"'"'s hosts diagnostic left no result (the job was stopped before its upload)"}]}' \
                > "$RUNNER_TEMP/obs/observations-studio-hosts-$scope.json"
            done
          fi
          flags=(--run-ok)
          if [ "$FAILED" = true ]; then
            flags=()
            jq -n '{observations: [{kind: "update-failed", repo: null, channel: null,
              version: null, detail: "a job failed or was cancelled"}]}' > "$RUNNER_TEMP/obs/observations-run.json"
          fi
          shopt -s nullglob
          node scripts/ci/issues.ts "$RUNNER_TEMP"/obs/*.json "${flags[@]}" > "$RUNNER_TEMP/dry-run/issues.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.DRY_RUN == 'true'
        with:
          # A re-run replaces its earlier attempt's artifact.
          overwrite: true
          name: dry-run-issues
          path: ${{ runner.temp }}/dry-run
          if-no-files-found: ignore
          retention-days: 7
